# Process the live Pi transcript, not the logger's numbered messages.
# See docs/MECHANISMS.md. No replacements are enabled by default.
version = 2

[mechanisms.preamble]
kind = "preamble"

[mechanisms.system_sections]
kind = "tagged_sections"

[mechanisms.prime]
kind = "tagged_message"
role = "user"
tag = "prime_session"

# Discovery appends empty tables using stable context names:
# [system_prompt.preamble]
# replacement = "You are a coding assistant."
# [system_prompt.sections.docs]
# replacement = "Use the installed Pi documentation."
# [bootstrap.prime_session]
# replacement = "Keep the session preferences."
